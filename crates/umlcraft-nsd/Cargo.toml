[package]
name = "umlcraft-nsd"
description = "Nassi-Shneiderman diagrams in Structorizer's .nsd format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Diagrams serialize as their content (`content`), as UmlCraft projects keep them.
serde = ["dep:serde", "dep:indexmap"]

[dependencies]
quick-xml.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
serde_json.workspace = true
# The drawing test rasterizes our SVG and decodes Structorizer's PNG images.
resvg.workspace = true

[lints]
workspace = true
